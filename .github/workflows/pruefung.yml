name: KAPA Digital Profil Qualitaetspruefung

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Profil prüfen
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('profile/README.md')
          assert p.is_file() and p.read_text(encoding='utf-8-sig').strip(), 'GitHub-Profil fehlt oder leer'
          print('Profil vorhanden')
          PY
